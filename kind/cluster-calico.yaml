# Same as cluster.yaml but without the default CNI, so Calico can enforce
# NetworkPolicies. Used when bootstrap.sh is run with NETPOL_CNI=calico.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: delivery-lab
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
