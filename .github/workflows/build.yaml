# CI builds and pushes the image ONLY. It never touches the cluster.
# Deployment happens when the image tag is changed in Git (services/storefront/overlays/*).
name: build-image
on:
  push:
    branches: [main]
    paths: ["app/**"]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute immutable tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
          echo "image=ghcr.io/dhinesh181999/storefront" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
