apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 66.2.1   # pinned
    helm:
      valuesObject:
        fullnameOverride: prometheus-stack   # -> Service prometheus-stack-prometheus:9090
        grafana: {enabled: false}
        alertmanager: {enabled: false}
        kubeEtcd: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeControllerManager: {enabled: false}
        kubeProxy: {enabled: false}
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false   # pick up ingress-nginx ServiceMonitor
            podMonitorSelectorNilUsesHelmValues: false
            retention: 6h
            resources:
              requests: {cpu: 100m, memory: 400Mi}
              limits: {cpu: 1000m, memory: 1Gi}
        prometheusOperator:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
