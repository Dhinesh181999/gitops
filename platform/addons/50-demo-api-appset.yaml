apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-api
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Dhinesh181999/gitops.git
        revision: main
        directories:
          - path: services/demo-api/overlays/*
  template:
    metadata:
      name: 'demo-api-{{.path.basename}}'
    spec:
      project: demo-api
      source:
        repoURL: https://github.com/Dhinesh181999/gitops.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'demo-{{.path.basename}}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
        retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
      ignoreDifferences:
        - group: ""
          kind: Service
          jsonPointers: [/spec/selector]
