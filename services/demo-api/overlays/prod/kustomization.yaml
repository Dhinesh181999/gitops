apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
images:
  - name: ghcr.io/dhinesh181999/demo-api
    newTag: v1.0.0
patches:
  - target: {kind: Rollout, name: demo-api}
    path: rollout-patch.yaml
  - target: {kind: Ingress, name: demo-api}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: demo-prod.localtest.me}
