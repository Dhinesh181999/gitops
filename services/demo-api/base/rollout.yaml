apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: demo-api}
  template:
    metadata:
      labels: {app: demo-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/dhinesh181999/demo-api
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_ENV, value: base}
            - {name: ERROR_RATE, value: "0"}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: secrets, mountPath: /etc/demo-api/secrets, readOnly: true}
      volumes:
        - name: secrets
          secret:
            secretName: demo-api-secrets
            optional: true
  strategy:
    canary:
      stableService: demo-api-stable
      canaryService: demo-api-canary
      trafficRouting:
        nginx:
          stableIngress: demo-api
      steps:
        - setWeight: 100
