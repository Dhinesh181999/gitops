# Canary gate: share of 5xx responses from the canary service, measured at ingress-nginx.
# No traffic => "or on() vector(0)" => 0 => passes (use scripts/traffic.sh to feed it).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: {name: error-rate}
spec:
  args:
    - name: canary-service
    - name: namespace
    - name: threshold
      value: "0.05"
  metrics:
    - name: http-5xx-ratio
      interval: 20s
      initialDelay: 20s
      failureLimit: 2          # 3rd failed measurement => Failed => automatic abort/rollback
      successCondition: result[0] < {{args.threshold}}
      provider:
        prometheus:
          address: http://prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(nginx_ingress_controller_requests{exported_namespace="{{args.namespace}}",service="{{args.canary-service}}",status=~"5.."}[1m]))
              /
              sum(rate(nginx_ingress_controller_requests{exported_namespace="{{args.namespace}}",service="{{args.canary-service}}"}[1m]))
            ) or on() vector(0)
