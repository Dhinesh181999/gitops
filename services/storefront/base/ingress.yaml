# Stable ingress. Argo Rollouts creates/manages the companion "-canary" ingress
# (canary-weight annotation) that does the real traffic split in ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: storefront}
spec:
  ingressClassName: nginx
  rules:
    - host: shop.localtest.me     # patched per overlay; *.localtest.me resolves to 127.0.0.1
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: storefront-stable, port: {number: 80}}}
