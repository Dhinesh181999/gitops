# Per-environment knobs for the Rollout (JSON6902).
- {op: replace, path: /spec/replicas, value: 2}
- {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: staging}
- {op: replace, path: /spec/template/spec/containers/0/env/1/value, value: "0"}   # ERROR_RATE
- op: add
  path: /spec/strategy/canary/analysis      # background analysis: runs for the whole canary
  value:
    startingStep: 1
    templates: [{templateName: error-rate}]
    args:
      - {name: canary-service, value: storefront-canary}
      - {name: namespace, value: shop-staging}
- op: replace
  path: /spec/strategy/canary/steps
  value:
    - setWeight: 20
    - pause: {duration: 20s}
    - setWeight: 50
    - pause: {duration: 20s}
