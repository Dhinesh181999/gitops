apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources:
  - ../../base
  - sealed-secret.yaml     # ciphertext only; generated by scripts/seal.sh
images:
  - name: ghcr.io/dhinesh181999/storefront
    newTag: v1.0.0             # <- promotion / version update = edit this line
patches:
  - target: {kind: Rollout, name: storefront}
    path: rollout-patch.yaml
  - target: {kind: Ingress, name: storefront}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: shop-prod.localtest.me}
